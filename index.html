<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <title>Bounty Hunter Cockpit | %NAME%</title>
    <meta
      name="description"
      content="A cinematic Star Wars-inspired portfolio. Climb into the cockpit and hunt down the galaxy's best engineering talent."
    />
    <!-- Link previews (Slack, LinkedIn, iMessage...). %SITE_URL% comes from portfolio.site.siteUrl;
         the image is public/og-image.png (npm run og:image). -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bounty Hunter Cockpit" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Bounty Hunter Cockpit | %NAME%" />
    <meta
      property="og:description"
      content="Wanted: the best talent in the Outer Rim. A cinematic Star Wars-inspired portfolio."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A wanted poster for %NAME% beside the words Bounty Hunter Cockpit." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <noscript>
      <p style="padding: 1rem; font-family: sans-serif; color: #e8eef2">
        The cockpit needs JavaScript. Read the
        <a href="/dossier" style="color: #5fd4ff">plain dossier</a> instead.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
